name: Build Docker Images

# Se activa con cada cambio en qa (después de que el PR ya se mergeó), para
# mantener siempre una imagen de Docker actualizada que refleje el estado
# real de esa rama. También se puede correr manualmente desde la pestaña
# Actions con "Run workflow".
#
# Las imágenes se publican en GitHub Container Registry (ghcr.io), que no
# necesita ningún secret adicional: usa el GITHUB_TOKEN que ya existe
# automáticamente en cada repositorio.

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    # Corre en la computadora del equipo registrada como self-hosted runner
    # (Settings -> Actions -> Runners). Esa máquina debe estar prendida y
    # con Docker Desktop corriendo para que este job se pueda ejecutar.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nombre del repositorio a minusculas
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          echo "REPO_LOWER=$repo" >> $env:GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:qa
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

  build-frontend:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nombre del repositorio a minusculas
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          echo "REPO_LOWER=$repo" >> $env:GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:qa
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

  redeploy:
    # Una vez publicadas las dos imágenes, reconstruye y reinicia los
    # contenedores locales con el código nuevo (docker-compose.yml), y deja
    # la base de datos al día. Esto es lo que hace que el pipeline se sienta
    # "vivo" en la máquina del equipo, no solo que publique imágenes.
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Reiniciar los contenedores con el código nuevo
        shell: powershell
        run: |
          docker compose down
          docker compose up -d --build --wait

      - name: Instalar dependencias del backend (para correr Prisma)
        shell: powershell
        working-directory: backend
        run: npm ci

      - name: Aplicar migraciones pendientes a la base de datos local
        shell: powershell
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root123@localhost:3307/bolsa_trabajo_upa"
        run: npx prisma migrate deploy