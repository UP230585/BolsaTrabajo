name: Continuous Integration

on:
  push:
    branches:
      - qa
      - main
  pull_request:
    branches:
      - qa
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - frontend
          - backend

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    env:
      # Dummy solo para que "prisma generate" no truene por falta de la variable
      # (no se conecta de verdad a MySQL en este paso, solo genera tipos).
      DATABASE_URL: "mysql://user:pass@localhost:3306/ci"
      JWT_SECRET: "ci-only-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present